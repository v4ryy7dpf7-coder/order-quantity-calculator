<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>発注計算</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  /* レイアウト：上にフォルダ型のタブ（限定／継続）、その下に手法名、残りの高さに各計算ページ */
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1e2833; --sub:#5b6570;
    --line:#dcd8cf; --teal:#2f6f6b; --soft:#ecebe4;
    --font:'Atkinson Hyperlegible','BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,system-ui,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181c21; --card:#222830; --ink:#f0eee8; --sub:#a3abb4;
      --line:#39414b; --teal:#7fbdb6; --soft:#2a313a; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#181c21; --card:#222830; --ink:#f0eee8; --sub:#a3abb4;
    --line:#39414b; --teal:#7fbdb6; --soft:#2a313a; color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
  }
  .folder{flex:1; min-height:0; display:flex; flex-direction:column; width:100%; max-width:560px; margin:0 auto; padding:12px 12px 0}
  .tabs{display:flex; gap:6px; padding-left:4px}
  .tabs button{
    padding:10px 22px 8px; font-size:17px; font-weight:700; font-family:inherit; letter-spacing:.06em;
    border:1px solid var(--line); border-bottom:none; border-radius:12px 12px 0 0;
    background:var(--soft); color:var(--sub); cursor:pointer; position:relative; top:1px;
  }
  .tabs button[aria-selected="true"]{background:var(--card); color:var(--ink); z-index:1}
  .tabs button:focus-visible{outline:2px solid var(--teal); outline-offset:1px}
  .panel{
    flex:1; min-height:0; display:flex; flex-direction:column;
    background:var(--card); border:1px solid var(--line); border-bottom:none; border-radius:0 12px 0 0;
  }
  .method{
    margin:12px 12px 0; padding:8px 14px; border:1.5px solid var(--ink); border-radius:10px;
    font-size:16px; font-weight:700; text-align:center; letter-spacing:.04em;
  }
  .method small{display:block; font-size:13px; font-weight:400; color:var(--sub)}
  .frame{flex:1; min-height:0; margin-top:10px; border-top:1px solid var(--line)}
  .frame iframe{display:block; width:100%; height:100%; border:0; background:var(--bg)}
</style>
</head>
<body>
<div class="folder">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-limited" aria-controls="panel" aria-selected="true" data-k="limited">限定</button>
    <button type="button" role="tab" id="tab-cont" aria-controls="panel" aria-selected="false" data-k="cont">継続</button>
  </div>
  <div class="panel" id="panel" role="tabpanel">
    <div class="method" id="method"></div>
    <div class="frame">
      <iframe id="f-limited" title="限定発注クイック計算" allow="web-share; clipboard-write"></iframe>
      <iframe id="f-cont" title="継続発注クイック計算" allow="web-share; clipboard-write" hidden></iframe>
    </div>
  </div>
</div>

<!-- 限定発注：初めて仕入れる景品（元の index.html をそのまま格納） -->
<template id="src-limited">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>限定発注クイック計算</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#f6f4ef; --card:#ffffff; --ink:#1e2833; --sub:#5b6570;
    --line:#dcd8cf; --accent:#c1553a; --teal:#2f6f6b; --soft:#ecebe4;
    --lim:#7a9a12; --chip-fg:#ffffff;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181c21; --card:#222830; --ink:#f0eee8; --sub:#a3abb4;
      --line:#39414b; --accent:#e08468; --teal:#7fbdb6; --soft:#2a313a;
      --lim:#94b82a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#181c21; --card:#222830; --ink:#f0eee8; --sub:#a3abb4;
    --line:#39414b; --accent:#e08468; --teal:#7fbdb6; --soft:#2a313a;
    --lim:#94b82a;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Atkinson Hyperlegible','BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,system-ui,sans-serif;
    font-size:18px; line-height:1.8; letter-spacing:0.04em; word-spacing:0.08em;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:520px; margin:0 auto; padding:16px 16px 48px}
  h1{font-size:19px; margin:4px 0 14px; font-weight:700}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px}
  .result{background:#1e2833; color:#f6f4ef; border:none; text-align:center; padding:28px 18px}
  /* 限定発注の色：継続発注の R（紫）・Q（オレンジ）と同じ付け方で黄緑 */
  .card:not(.result){border-top:4px solid var(--lim)}
  .result{box-shadow:0 0 0 4px var(--lim)}
  .modetag{display:inline-block; padding:2px 12px; border-radius:999px; font-size:14px; font-weight:700; color:var(--chip-fg); background:var(--lim); margin-bottom:8px}
  .qnum{font-size:76px; font-weight:700; line-height:1.05; letter-spacing:-1px}
  .qunit{font-size:26px; font-weight:700; margin-left:6px}
  .qlabel{font-size:16px; opacity:.85; margin:0 0 6px; letter-spacing:.5px}
  .qsub{font-size:16px; opacity:.9; margin:14px 0 0; line-height:1.8}
  .alert{margin-top:14px; padding:12px 14px; border-radius:12px; background:#5a2a20; color:#ffd9cc; font-size:16px; line-height:1.6; text-align:left}
  label{display:block; font-size:16px; color:var(--sub); margin-bottom:6px; font-weight:600}
  .row{display:flex; gap:10px}
  .row>div{flex:1}
  input[type=date]{
    width:100%; font-size:26px; font-weight:700; padding:18px 12px; text-align:center;
    border:1px solid var(--line); border-radius:14px; background:var(--bg); color:var(--ink);
    font-family:inherit; min-height:64px; -webkit-appearance:none; appearance:none;
  }
  input[type=date]:focus{outline:2px solid var(--teal); outline-offset:1px}
  input[type=date]::-webkit-calendar-picker-indicator{
    width:28px; height:28px; cursor:pointer; opacity:.7;
  }
  input[type=number],input[type=text]{
    width:100%; font-size:24px; font-weight:600; padding:12px 10px; text-align:center;
    border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink);
    font-family:inherit; -moz-appearance:textfield;
  }
  input[type=text]{font-size:17px; font-weight:400; text-align:left}
  input.money{font-size:24px; font-weight:600; text-align:center}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  input:focus{outline:2px solid var(--teal); outline-offset:1px}
  .hint{font-size:16px; color:var(--sub); margin:8px 0 0; line-height:1.8}
  .seg{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap}
  .seg button{
    flex:1; min-width:80px; padding:12px 4px; font-size:16px; font-weight:600; font-family:inherit;
    border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); cursor:pointer;
  }
  .seg button[aria-pressed="true"]{background:var(--teal); border-color:var(--teal); color:#fff}
  .toggle{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .switch{
    flex:0 0 auto; width:60px; height:34px; border-radius:17px; border:1px solid var(--line);
    background:var(--soft); position:relative; cursor:pointer; padding:0;
  }
  .switch[aria-pressed="true"]{background:var(--accent); border-color:var(--accent)}
  .knob{position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:left .15s}
  .switch[aria-pressed="true"] .knob{left:29px}
  details{margin-top:4px}
  summary{font-size:17px; color:var(--teal); font-weight:600; cursor:pointer; padding:6px 0}
  .warn{color:var(--accent); font-size:16px; margin:10px 0 0}
  .btnrow{display:flex; gap:10px; margin-bottom:14px}
  .btn{
    flex:1; padding:16px 8px; font-size:17px; font-weight:700; font-family:inherit;
    border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
  }
  .btn.primary{background:var(--teal); border-color:var(--teal); color:#fff}
  .rec{border-top:1px solid var(--line); padding:12px 0}
  .rec:first-of-type{border-top:none}
  .rec h3{font-size:17px; margin:0 0 2px; font-weight:700}
  .rec p{font-size:15px; color:var(--sub); margin:0; line-height:1.7}
  .recbtns{display:flex; gap:8px; margin-top:8px}
  .recbtns button{
    padding:8px 14px; font-size:15px; font-family:inherit; font-weight:600; cursor:pointer;
    border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink);
  }
  .recbtns .del{color:var(--accent)}
  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom,0px));
    background:#1e2833; color:#f6f4ef; padding:12px 20px; border-radius:24px; font-size:16px;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:10;
  }
  .toast.show{opacity:1}
  .foot{font-size:15px; color:var(--sub); text-align:center; margin-top:18px; line-height:1.8}
  table.err{width:100%; border-collapse:collapse; margin-top:8px; font-size:15px}
  table.err th,table.err td{border-bottom:1px solid var(--line); padding:6px 4px; text-align:left}
  table.err th{color:var(--sub); font-weight:600}
  table.err td:last-child,table.err th:last-child{text-align:right}
</style>
<div class="wrap">
  <h1>限定発注クイック計算<span style="font-weight:400;color:var(--sub);font-size:16px"> ／ 初めて仕入れる景品</span></h1>

  <div class="card">
    <label for="name">景品名・タイトル</label>
    <input type="text" id="name" placeholder="例）〇〇フィギュア 第1弾">
    <label for="vendor" style="margin-top:14px">取引先</label>
    <input type="text" id="vendor" list="vendors" placeholder="例）〇〇商事">
    <datalist id="vendors"></datalist>
    <p class="hint">一度入れた取引先は次回から候補に出ます。</p>
  </div>

  <div class="card">
    <label>見立ての出し方</label>
    <div class="seg" id="modeseg">
      <button data-mode="manual" aria-pressed="true">人が見立てる</button>
      <button data-mode="auto" aria-pressed="false">台の売上から出す</button>
    </div>
  </div>

  <div class="card">
    <label>投入期間</label>
    <div class="seg" id="dayseg">
      <button data-days="7" aria-pressed="true">1週間</button>
      <button data-days="10" aria-pressed="false">10日</button>
      <button data-days="14" aria-pressed="false">2週間</button>
      <button data-days="28" aria-pressed="false">4週間</button>
    </div>
    <div class="row" style="margin-top:12px">
      <div>
        <label style="text-align:center">日数</label>
        <input type="number" id="days" inputmode="numeric" value="7">
      </div>
    </div>
    <p class="hint"><b>1週間を基準にしてください。</b>長い期間をまとめて見積もるほど、当たらなくなります。景品の入れ替わりは実績でも中央9日でした。</p>
    <div style="margin-top:12px">
      <label>開始日（曜日の重みを数えます）</label>
      <input type="date" id="start">
    </div>
    <p class="hint">1週間ちょうどなら、どの曜日から始めても結果は変わりません。半端な日数のときだけ効きます。</p>
    <div style="margin-top:14px">
      <label>期間に祝日が何日ありますか</label>
      <div class="seg" id="holseg">
        <button data-h="0" aria-pressed="true">なし</button>
        <button data-h="1" aria-pressed="false">1日</button>
        <button data-h="2" aria-pressed="false">2日</button>
        <button data-h="3" aria-pressed="false">3日</button>
      </div>
      <div class="row" style="margin-top:12px">
        <div>
          <label style="text-align:center">日数</label>
          <input type="number" id="holidays" inputmode="numeric" value="0">
        </div>
      </div>
      <p class="hint" id="holout">祝日は<b>日曜の80%</b>の売上として計算します。期間内で売上の低い日から順に置き換えます。シルバーウィーク（3連休）の実績を参考にした係数です。連休の中日は日曜ほど跳ねないためです。</p>
    </div>
    <details>
      <summary>曜日の倍率を調整する</summary>
      <p class="hint" style="margin-top:8px">月〜木を 1.0 としたときの倍率</p>
      <div class="row" style="margin-top:6px">
        <div>
          <label style="text-align:center">金</label>
          <input type="number" id="kfri" inputmode="decimal" step="0.05" value="1.30">
        </div>
        <div>
          <label style="text-align:center">土</label>
          <input type="number" id="ksat" inputmode="decimal" step="0.05" value="2.30">
        </div>
        <div>
          <label style="text-align:center">日</label>
          <input type="number" id="ksun" inputmode="decimal" step="0.05" value="2.50">
        </div>
      </div>
      <p class="hint">土日1日は平日の約2.3倍、土日で週売上のほぼ半分を占めます。</p>
    </details>
  </div>

  <div class="card" id="autobox" style="display:none">
    <label>台の売上から推定</label>
    <div class="row">
      <div>
        <label style="text-align:center">台の週売上（円）</label>
        <input type="text" class="money" id="daily" inputmode="numeric" placeholder="56,000">
      </div>
      <div>
        <label style="text-align:center">景品の原価（円）</label>
        <input type="text" class="money" id="pcost" inputmode="numeric" placeholder="800">
      </div>
    </div>
    <div style="margin-top:12px">
      <label>目標原価率（%）</label>
      <input type="number" id="rate" inputmode="numeric" placeholder="25">
    </div>
    <p class="hint" id="autoout">P・M・O：–</p>
    <details>
      <summary>ばらつきの幅を調整する</summary>
      <p class="hint" style="margin-top:8px">点推定 M に対する倍率です。</p>
      <div class="row" style="margin-top:6px">
        <div>
          <label style="text-align:center">下振れ P</label>
          <input type="number" id="lowk" inputmode="decimal" step="0.05" value="0.6">
        </div>
        <div>
          <label style="text-align:center">上振れ O</label>
          <input type="number" id="highk" inputmode="decimal" step="0.05" value="1.5">
        </div>
      </div>
    </details>
  </div>

  <div class="card" id="manualbox">
    <label>見立ての単位</label>
    <div class="seg" id="unitseg">
      <button data-u="period" aria-pressed="true">期間全体で</button>
      <button data-u="day" aria-pressed="false">1日あたり</button>
      <button data-u="week" aria-pressed="false">1週間あたり</button>
    </div>
    <label style="margin-top:14px">見立て（何個取られるか）</label>
    <div class="row">
      <div>
        <label style="text-align:center">P 悲観</label>
        <input type="number" id="p" inputmode="numeric" placeholder="12">
      </div>
      <div>
        <label style="text-align:center">M 最頻</label>
        <input type="number" id="m" inputmode="numeric" placeholder="30">
      </div>
      <div>
        <label style="text-align:center">O 楽観</label>
        <input type="number" id="o" inputmode="numeric" placeholder="60">
      </div>
    </div>
    <p class="hint" id="manualout">期間合計：–</p>
    <p class="hint"><b>O と P は「あり得る範囲の端」</b>で、絶対にあり得ない極端な数字ではありません。目安は<b>10回に1回くらい起きる水準</b>。「最高に当たったら」「全然ダメだったら」と両端から聞くと出しやすくなります。</p>
    <p class="warn" id="warn" style="display:none"></p>
  </div>

  <div class="card">
    <label>仕入れ単位</label>
    <div class="row">
      <div>
        <label style="text-align:center">1単位の入数（個）</label>
        <input type="number" id="unit" inputmode="numeric" placeholder="12">
      </div>
      <div>
        <label style="text-align:center">単位の呼び方</label>
        <input type="text" id="uname" placeholder="箱" style="text-align:center; font-size:22px; font-weight:600">
      </div>
    </div>
    <p class="hint">入れると、発注量を単位に丸めて「何単位発注するか」を出します。</p>
  </div>

  <div class="card">
    <label>あとから追加発注できますか</label>
    <div class="seg" id="reorderseg">
      <button data-r="0" aria-pressed="true">できない</button>
      <button data-r="1" aria-pressed="false">できる</button>
    </div>
    <p class="hint" id="reorderout"><b>「できない」を選択中。</b>品切れに備えて、安全側に上乗せした数を出します。</p>
  </div>

  <div class="card" id="crcard">
    <label>臨界比 CR</label>
    <p class="hint" style="margin-top:0">
      <b>仕入れすぎた損</b>と<b>品切れで取り逃がした損</b>を天秤にかけた数字です。
      数字が大きいほど「品切れの方が痛い」と考え、多めに発注します。
      検証では 0.60 が一番バランスが良い結果でした。品切れを避けたい景品は 0.70 以上にしてください。
    </p>
    <div class="seg" id="crseg">
      <button data-cr="0.5" aria-pressed="false">0.50</button>
      <button data-cr="0.6" aria-pressed="true">0.60</button>
      <button data-cr="0.7" aria-pressed="false">0.70</button>
      <button data-cr="custom" aria-pressed="false">金額から</button>
    </div>
    <details id="crcalc">
      <summary>金額から CR を出す</summary>
      <div class="row" style="margin-top:8px">
        <div>
          <label style="text-align:center">想定売上／個</label>
          <input type="text" class="money" id="rev" inputmode="numeric" placeholder="4,000">
        </div>
        <div>
          <label style="text-align:center">仕入価格／個</label>
          <input type="text" class="money" id="cost" inputmode="numeric" placeholder="800">
        </div>
      </div>
      <div style="margin-top:10px">
        <label>残存価値／個</label>
        <p class="hint" style="margin-top:0">
          余った景品が<b>まだ生む価値</b>のことです。他店舗へ移して使える分や、事故台などで回収できる額を指します。
          ここが大きいほど「余っても無駄にならない」ので、多めに発注してよいことになります。
          逆に賞味期限切れや旬を過ぎた景品はゼロに近づき、<b>廃棄にお金がかかる場合はマイナス</b>になります。
        </p>
        <input type="text" class="money" id="salv" inputmode="numeric" placeholder="0">
      </div>

      <details style="margin-top:16px; padding-top:14px; border-top:1px solid var(--line)">
        <summary>残存価値の見積もりサポート</summary>
        <p class="hint" style="margin-top:6px">選ぶと、上の残存価値に自動で入ります。</p>

        <p class="hint" style="margin-top:12px; color:var(--ink)">① 余った分を他店・他台で使い切れるか</p>
        <div class="seg" id="segUse">
          <button data-v="1" aria-pressed="false">ほぼ全部</button>
          <button data-v="0.8" aria-pressed="true">だいたい</button>
          <button data-v="0.5" aria-pressed="false">半分</button>
          <button data-v="0.15" aria-pressed="false">ほぼ無理</button>
        </div>

        <p class="hint" style="margin-top:12px; color:var(--ink)">② 旬の落ちやすさ</p>
        <div class="seg" id="segFresh">
          <button data-v="1" aria-pressed="false">定番（落ちない）</button>
          <button data-v="0.8" aria-pressed="true">ふつう</button>
          <button data-v="0.5" aria-pressed="false">話題次第</button>
        </div>

        <p class="hint" style="margin-top:12px; color:var(--ink)">③ 食品（賞味期限）</p>
        <div class="seg" id="segFood">
          <button data-v="0" aria-pressed="true">期限なし</button>
          <button data-v="1" aria-pressed="false">賞味期限あり</button>
        </div>
        <div id="foodbox" style="display:none; margin-top:10px">
          <div class="row">
            <div>
              <label style="text-align:center">賞味期限</label>
              <input type="date" id="expiry" style="font-size:20px; padding:12px 8px; min-height:52px">
            </div>
          </div>
          <div style="margin-top:10px">
            <label>他店で売り切るのに必要な日数</label>
            <input type="number" id="selldays" inputmode="numeric" placeholder="30" value="30">
          </div>
          <p class="hint" id="foodout">期限による目減り：–</p>
        </div>

        <div style="margin-top:12px">
          <label>④ 廃棄にかかる費用（1個あたり・円）</label>
          <input type="text" class="money" id="disposal" inputmode="numeric" placeholder="0">
          <p class="hint">使い切れずに捨てる分の処分費。かからなければ空欄のままで構いません。</p>
        </div>

        <div style="margin-top:12px">
          <label>⑤ 移送・保管の手間（1個あたり・円）</label>
          <input type="text" class="money" id="movecost" inputmode="numeric" placeholder="50">
          <details style="margin-top:6px">
            <summary>手間を計算する</summary>
            <div class="row" style="margin-top:8px">
              <div>
                <label style="text-align:center">1便の運賃（円）</label>
                <input type="text" class="money" id="tripcost" inputmode="numeric" placeholder="3,000">
              </div>
              <div>
                <label style="text-align:center">1便で運ぶ個数</label>
                <input type="number" id="tripqty" inputmode="numeric" placeholder="200">
              </div>
            </div>
            <div class="row" style="margin-top:10px">
              <div>
                <label style="text-align:center">積み下ろし（分）</label>
                <input type="number" id="worktime" inputmode="numeric" placeholder="30">
              </div>
              <div>
                <label style="text-align:center">時給（円）</label>
                <input type="text" class="money" id="wage" inputmode="numeric" placeholder="1,200">
              </div>
            </div>
            <p class="hint" id="moveout">1個あたり：–</p>
          </details>
        </div>
        <p class="hint" id="salvout">残存価値：–</p>
      </details>

      <p class="hint" id="crout">CR：–</p>
    </details>
  </div>

  <div class="card result">
    <span class="modetag">限定発注を計算中</span>
    <p class="qlabel" id="qlabel">発注量</p>
    <div><span class="qnum" id="q">–</span><span class="qunit" id="qunit">個</span></div>
    <p class="qsub" id="qsub">O・M・P を入れてください</p>
    <div class="alert" id="alert" style="display:none"></div>
  </div>

  <div class="btnrow">
    <button class="btn primary" id="save">保存する</button>
    <button class="btn" id="share">共有する</button>
  </div>

  <div class="card" id="histcard" style="display:none">
    <label style="margin-bottom:10px">保存した計算</label>
    <div id="hist"></div>
    <div class="recbtns" style="margin-top:14px">
      <button id="csv">CSVで書き出す</button>
    </div>
  </div>

  <p class="foot">Q =（O + 4M + P）÷ 6 ＋ z ×（O − P）÷ 6</p>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var state = { cr: 0.60, mode: 'preset', reorder: false, input: 'manual' };
  var last = null;

  try {
    var saved = localStorage.getItem('orderqty-cr2');
    if (saved) { var v = parseFloat(saved); if (v > 0 && v < 1) state.cr = v; }
  } catch(e) {}

  // 逆正規分布（Acklam の近似）
  function ppf(p){
    if (!(p > 0 && p < 1)) return NaN;
    var a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00],
        b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01],
        c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00],
        d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
    var pl=0.02425, q, r;
    if (p < pl){
      q = Math.sqrt(-2*Math.log(p));
      return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    }
    if (p > 1-pl){
      q = Math.sqrt(-2*Math.log(1-p));
      return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    }
    q = p-0.5; r = q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  }

  // 全角数字を半角に直し、数字以外を取り除く
  function digitsOnly(str){
    var out = '';
    for (var i = 0; i < str.length; i++){
      var c = str.charCodeAt(i);
      if (c >= 0xFF10 && c <= 0xFF19) out += String.fromCharCode(c - 0xFF10 + 48);
      else if (c >= 48 && c <= 57) out += str[i];
    }
    return out;
  }

  function comma(n){
    var str = digitsOnly(String(n));
    if (!str) return '';
    str = str.replace(/^0+/, '') || '0';
    var out = '';
    for (var i = 0; i < str.length; i++){
      if (i > 0 && (str.length - i) % 3 === 0) out += ',';
      out += str[i];
    }
    return out;
  }

  // 数値として読む：全角を半角に直し、カンマや空白を取り除く（小数点と符号は残す）
  function num(id){
    var str = String($(id).value), out = '';
    for (var i = 0; i < str.length; i++){
      var c = str.charCodeAt(i);
      if (c >= 0xFF10 && c <= 0xFF19) out += String.fromCharCode(c - 0xFF10 + 48);
      else if ((c >= 48 && c <= 57) || str[i] === '.' || str[i] === '-') out += str[i];
      else if (c === 0xFF0E) out += '.';
      else if (c === 0x2212 || c === 0xFF0D) out += '-';
    }
    var v = parseFloat(out);
    return isFinite(v) ? v : null;
  }

  // 入力中は触らず、欄から離れた時だけカンマを入れる
  Array.prototype.forEach.call(document.querySelectorAll('input.money'), function(el){
    function neg(v){ return /^\s*[-−－]/.test(v) ? '-' : ''; }
    el.addEventListener('blur', function(){
      var d = digitsOnly(el.value);
      el.value = d ? neg(el.value) + comma(d) : '';
    });
    el.addEventListener('focus', function(){
      var d = digitsOnly(el.value);
      el.value = d ? neg(el.value) + d : '';
    });
  });

  // 投入期間の「日数ぶんの重み合計」。曜日の重みを数え、1日平均を1として合計する
  function periodFactor(){
    var days = num('days');
    if (days === null || days <= 0) return null;
    var kfri = num('kfri'), ksat = num('ksat'), ksun = num('ksun');
    if (kfri === null || kfri <= 0) kfri = 1.30;
    if (ksat === null || ksat <= 0) ksat = 2.30;
    if (ksun === null || ksun <= 0) ksun = 2.50;
    var k = [ksun, 1, 1, 1, 1, kfri, ksat];          // 日,月,火,水,木,金,土
    var weekAvg = (4 + kfri + ksat + ksun) / 7;
    var hol = num('holidays');
    if (hol === null || hol < 0) hol = 0;
    hol = Math.min(Math.floor(hol), days);

    var startStr = $('start').value;
    var vals = [];
    if (!startStr){
      // 開始日なし＝どの日も「平均的な1日」とみなす。祝日ぶんだけ日曜に置き換える
      for (var i = 0; i < days; i++) vals.push(weekAvg);
    } else {
      var d = new Date(startStr + 'T00:00:00');
      for (var n = 0; n < days; n++){ vals.push(k[d.getDay()]); d.setDate(d.getDate() + 1); }
    }
    if (hol > 0){
      var khol = ksun * 0.8;                               // 祝日は日曜の80%
      vals.sort(function(a,b){ return a - b; });           // 低い日から祝日に置き換える
      for (var j = 0; j < hol; j++) if (vals[j] < khol) vals[j] = khol;
    }
    var total = 0;
    for (var m2 = 0; m2 < vals.length; m2++) total += vals[m2] / weekAvg;
    return { total: total, days: days, adj: total / days, hol: hol };
  }

  function estimate(){
    var daily = num('daily'), pcost = num('pcost'), rate = num('rate');
    var lowk = num('lowk'), highk = num('highk');
    if (lowk === null || lowk <= 0) lowk = 0.6;
    if (highk === null || highk <= 0) highk = 1.5;
    var pf = periodFactor();

    if (daily === null || pf === null || pcost === null || rate === null || rate <= 0 || pcost <= 0){
      $('autoout').textContent = 'P・M・O：–　（週売上・原価・原価率・日数を入れてください）';
      return null;
    }
    var perDay = daily / 7;
    var perPiece = pcost / (rate / 100);
    var m = (perDay * pf.total) / perPiece;
    var est = { m: Math.round(m), o: Math.round(m * highk), p: Math.round(m * lowk), per: Math.round(perPiece), raw: m };
    var note = $('start').value ? '曜日補正 ' + pf.adj.toFixed(2) + '倍　' : '開始日を入れると曜日で補正　';
    $('autoout').textContent = note + '1個あたり売上 ' + comma(est.per) + '円 ／ P ' + est.p + ' ・ M ' + est.m + ' ・ O ' + est.o;
    return est;
  }

  // 人が見立てた値を、投入期間の合計に換算する
  var manualUnit = 'period';
  function manualValues(){
    var o = num('o'), m = num('m'), p = num('p');
    if (o === null || m === null || p === null){ $('manualout').textContent = '期間合計：–'; return null; }
    if (manualUnit === 'period'){ $('manualout').textContent = '期間合計：P ' + o0(p) + ' ・ M ' + o0(m) + ' ・ O ' + o0(o); return { o: o, m: m, p: p }; }
    var pf = periodFactor();
    if (pf === null){ $('manualout').textContent = '期間合計：–　（日数を入れてください）'; return null; }
    var mul = manualUnit === 'day' ? pf.total : pf.total / 7;
    var r = { o: o * mul, m: m * mul, p: p * mul };
    $('manualout').textContent = '期間合計：P ' + o0(r.p) + ' ・ M ' + o0(r.m) + ' ・ O ' + o0(r.o)
      + '　（' + (manualUnit === 'day' ? '1日' : '1週間') + 'の値 × ' + mul.toFixed(2) + '）';
    return r;
  }
  function o0(n){ return Math.round(n); }

  Array.prototype.forEach.call(document.querySelectorAll('#unitseg button'), function(btn){
    btn.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('#unitseg button'), function(b){
        b.setAttribute('aria-pressed','false');
      });
      btn.setAttribute('aria-pressed','true');
      manualUnit = btn.dataset.u;
      calc();
    });
  });

  var salvSel = { use: 0.8, fresh: 0.8, food: 0 };
  var salvUsed = false;   // サポートを触るまでは、手入力の残存価値を上書きしない

  function moveCost(){
    var trip = num('tripcost'), qty = num('tripqty'), mins = num('worktime'), wage = num('wage');
    if (trip === null || qty === null || qty <= 0){
      $('moveout').textContent = '1個あたり：–　（運賃と個数を入れてください）';
      return null;
    }
    if (mins === null) mins = 0;
    if (wage === null) wage = 0;
    var labor = mins / 60 * wage;
    var per = Math.round((trip + labor) / qty);
    $('moveout').textContent = '1個あたり：' + per + '円　（運賃 ' + comma(trip) + ' ＋ 人件費 ' + Math.round(labor) + ' ÷ ' + qty + '個）';
    $('movecost').value = comma(per);
    return per;
  }

  function foodFactor(){
    if (!salvSel.food) return 1;
    var exp = $('expiry').value;
    var need = num('selldays');
    if (need === null || need <= 0) need = 30;
    if (!exp){ $('foodout').textContent = '期限による目減り：–　（賞味期限を入れてください）'; return 1; }
    var days = num('days') || 0;
    var start = $('start').value ? new Date($('start').value + 'T00:00:00') : new Date();
    var end = new Date(start.getTime());
    end.setDate(end.getDate() + days);
    var left = Math.floor((new Date(exp + 'T00:00:00') - end) / 86400000);
    var f;
    if (left <= 0) f = 0;
    else if (left >= need) f = 1;
    else f = left / need;
    $('foodout').textContent = '期限による目減り：' + f.toFixed(2)
      + '倍　（投入終了時点で残り ' + left + '日 ／ 必要 ' + need + '日）'
      + (f === 0 ? '　期限切れのため残存価値ゼロ' : '');
    return f;
  }

  function salvage(){
    if (!salvUsed) return;
    var cost = num('cost');
    if (cost === null || cost <= 0){ $('salvout').textContent = '残存価値：–　（仕入価格を入れてください）'; return; }
    var move = num('movecost');
    if (move === null) move = 50;
    var disp = num('disposal') || 0;
    var ff = foodFactor();
    var keepRate = salvSel.use * ff;
    var v = cost * keepRate * salvSel.fresh - move * keepRate - disp * (1 - keepRate);
    v = Math.round(v);
    $('salv').value = (v < 0 ? '-' : '') + comma(Math.abs(v));
    $('salvout').textContent = '残存価値：' + (v < 0 ? '−' : '') + comma(Math.abs(v)) + '円'
      + (v < 0 ? '（廃棄費用が上回るためマイナス）' : '')
      + '　（使える割合 ' + (keepRate * 100).toFixed(0) + '%）';
  }

  function segPick(boxId, key){
    Array.prototype.forEach.call(document.querySelectorAll('#' + boxId + ' button'), function(btn){
      btn.addEventListener('click', function(){
        Array.prototype.forEach.call(document.querySelectorAll('#' + boxId + ' button'), function(b){
          b.setAttribute('aria-pressed','false');
        });
        btn.setAttribute('aria-pressed','true');
        salvSel[key] = parseFloat(btn.dataset.v);
        salvUsed = true;
        salvage();
        calc();
      });
    });
  }
  segPick('segUse', 'use');
  segPick('segFresh', 'fresh');
  segPick('segFood', 'food');

  Array.prototype.forEach.call(document.querySelectorAll('#segFood button'), function(btn){
    btn.addEventListener('click', function(){
      $('foodbox').style.display = btn.dataset.v === '1' ? 'block' : 'none';
      salvage();
    });
  });

  ['expiry','selldays','disposal','movecost'].forEach(function(id){
    $(id).addEventListener('input', function(){ salvUsed = true; salvage(); calc(); });
  });
  $('cost').addEventListener('input', function(){ salvage(); calc(); });
  ['tripcost','tripqty','worktime','wage'].forEach(function(id){
    $(id).addEventListener('input', function(){ salvUsed = true; moveCost(); salvage(); calc(); });
  });

  function calc(){
    var o, m, p, Mraw = null;
    if (state.input === 'auto'){
      var est = estimate();
      if (est){ o = est.o; m = est.m; p = est.p; Mraw = est.raw; } else { o = m = p = null; }
    } else {
      var mv = manualValues();
      if (mv){ o = mv.o; m = mv.m; p = mv.p; Mraw = mv.m; } else { o = m = p = null; }
    }
    var warn = $('warn');
    warn.style.display = 'none';
    var A = $('alert');
    A.style.display = 'none';

    if (state.mode === 'custom'){
      var rev = num('rev'), cost = num('cost'), salv = num('salv') || 0;
      if (rev !== null && cost !== null){
        var cu = rev - cost, co = cost - salv;
        if (cu > 0 && co > 0){
          var raw = cu / (cu + co);
          state.cr = Math.min(raw, 0.95);
          $('crout').textContent = 'CR：' + state.cr.toFixed(2)
            + '（Cu ' + Math.round(cu) + '円 ／ Co ' + Math.round(co) + '円）'
            + (raw > 0.95 ? '　※ 計算上は ' + raw.toFixed(2) + ' ですが 0.95 で頭打ちにしています' : '');
        } else {
          $('crout').textContent = 'CR：– （売上が仕入より高く、残存価値が仕入より低い必要があります）';
        }
      } else {
        $('crout').textContent = 'CR：–';
      }
    }

    var z = ppf(state.cr);

    if (o === null || m === null || p === null){
      $('q').textContent = '–';
      $('qunit').textContent = '個';
      $('qlabel').textContent = '発注量';
      $('qsub').textContent = state.input === 'auto'
        ? '売上・日数・原価・原価率を入れてください'
        : 'O・M・P を入れてください';
      last = null;
      return;
    }
    if (o < 0 || m < 0 || p < 0){
      warn.textContent = '0以上の数字を入れてください。';
      warn.style.display = 'block';
    } else if (!(o >= m && m >= p)){
      warn.textContent = '数値の大小が合いません（O ≧ M ≧ P）。';
      warn.style.display = 'block';
    }

    var mu = (o + 4*m + p) / 6;
    var sd = (o - p) / 6;
    var q = state.reorder ? mu : mu + z * sd;
    if (q < 0) q = 0;
    var qr = Math.ceil(q);
    var crnote = state.reorder ? '追加発注で調整する前提' : 'CR ' + state.cr.toFixed(2);

    var unit = num('unit');
    var uname = ($('uname').value || '').trim() || '箱';
    if (unit !== null && unit > 0){
      var units = Math.ceil(qr / unit);
      if (units < 1) units = 1;
      $('qlabel').textContent = '発注する単位数';
      $('q').textContent = units;
      $('qunit').textContent = uname;
      $('qsub').textContent = '必要 ' + qr + '個 → ' + unit + '個入り × ' + units + uname + ' ＝ ' + (units * unit) + '個　／　' + crnote;
    } else {
      $('qlabel').textContent = '発注量';
      $('q').textContent = qr;
      $('qunit').textContent = '個';
      $('qsub').textContent = crnote + ' ／ 仕入れ単位を入れると単位数で表示';
    }

    // 小口の警告：推定Mが30個を下回ると推定が成立しない
    if (Mraw !== null && Mraw > 0 && Mraw < 30){
      A.style.display = 'block';
      A.innerHTML = '<b>この規模では推定が当たりません。</b>払出30個以下の景品は、検証でも中央154%外れました。'
        + '数字は参考程度にして、現場の判断を優先してください。';
    }

    last = {
      name: ($('name').value || '').trim(),
      vendor: ($('vendor').value || '').trim(),
      o: Math.round(o), m: Math.round(m), p: Math.round(p),
      cr: state.reorder ? null : state.cr,
      reorder: state.reorder,
      days: num('days'),
      qty: qr,
      unit: (unit !== null && unit > 0) ? unit : null,
      uname: uname,
      units: (unit !== null && unit > 0) ? Math.ceil(qr / unit) : null
    };
  }

  // ---- 保存・共有 ----
  var KEY = 'orderqty-records';

  function loadRecords(){
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : []; }
    catch(e) { return []; }
  }
  function storeRecords(list){
    try { localStorage.setItem(KEY, JSON.stringify(list)); return true; }
    catch(e) { return false; }
  }
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  function summary(r){
    var head = (r.name || '(名称なし)') + (r.vendor ? '／' + r.vendor : '');
    var qline = r.units
      ? '発注 ' + r.units + r.uname + '（' + r.unit + '個入り ＝ ' + (r.units * r.unit) + '個）'
      : '発注 ' + r.qty + '個';
    var detail = '着地の見込み ' + r.p + '〜' + r.o + '個'
      + (r.reorder ? '（追加発注あり前提）' : ' / CR ' + r.cr.toFixed(2));
    return head + '\n' + qline + '\n' + detail;
  }

  function renderHistory(){
    var list = loadRecords();
    var box = $('hist');
    var names = {};
    box.innerHTML = '';
    $('histcard').style.display = list.length ? 'block' : 'none';
    list.forEach(function(r, i){
      if (r.vendor) names[r.vendor] = 1;
      var d = document.createElement('div');
      d.className = 'rec';
      var qline = r.units ? r.units + r.uname + '（' + (r.units * r.unit) + '個）' : r.qty + '個';
      d.innerHTML = '<h3></h3><p></p><div class="recbtns">'
        + '<button data-load="' + i + '">呼び出す</button>'
        + '<button class="del" data-del="' + i + '">削除</button></div>';
      d.querySelector('h3').textContent = (r.name || '(名称なし)') + '　' + qline;
      d.querySelector('p').textContent = (r.vendor ? r.vendor + '／' : '')
        + r.date + '　着地 ' + r.p + '〜' + r.o + '個';
      box.appendChild(d);
    });
    var dl = $('vendors');
    dl.innerHTML = '';
    Object.keys(names).forEach(function(n){
      var opt = document.createElement('option'); opt.value = n; dl.appendChild(opt);
    });
  }

  function pressOnly(boxId, attr, val){
    Array.prototype.forEach.call(document.querySelectorAll('#' + boxId + ' button'), function(b){
      b.setAttribute('aria-pressed', b.getAttribute(attr) === String(val) ? 'true' : 'false');
    });
  }
  function fill(r){
    $('name').value = r.name || '';
    $('vendor').value = r.vendor || '';
    // 保存した P・M・O は期間合計なので、「人が見立てる」「期間全体で」に戻してから入れる
    state.input = 'manual';
    pressOnly('modeseg', 'data-mode', 'manual');
    $('autobox').style.display = 'none';
    $('manualbox').style.display = 'block';
    manualUnit = 'period';
    pressOnly('unitseg', 'data-u', 'period');
    $('o').value = r.o; $('m').value = r.m; $('p').value = r.p;
    if (r.days){ $('days').value = r.days; pressOnly('dayseg', 'data-days', r.days); }
    $('unit').value = r.unit || '';
    $('uname').value = r.unit ? (r.uname || '') : '';
    setReorder(!!r.reorder);
    if (r.cr){
      state.cr = r.cr; state.mode = 'preset';
      Array.prototype.forEach.call(document.querySelectorAll('#crseg button'), function(b){
        b.setAttribute('aria-pressed', (parseFloat(b.dataset.cr) === r.cr) ? 'true' : 'false');
      });
    }
    calc();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  $('save').addEventListener('click', function(){
    if (!last){ toast('先に数字を入れてください'); return; }
    var r = JSON.parse(JSON.stringify(last));
    var d = new Date();
    r.date = d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate();
    var list = loadRecords();
    list.unshift(r);
    if (list.length > 50) list = list.slice(0, 50);
    if (storeRecords(list)){ renderHistory(); toast('保存しました'); }
    else { toast('保存できませんでした'); }
  });

  $('share').addEventListener('click', function(){
    if (!last){ toast('先に数字を入れてください'); return; }
    var text = summary(last);
    function copy(){
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ toast('コピーしました'); },
          function(){ toast('コピーできませんでした'); });
      } else { toast('この端末では共有できません'); }
    }
    if (navigator.share){
      navigator.share({ text: text }).catch(function(err){ if (!err || err.name !== 'AbortError') copy(); });
    } else copy();
  });

  $('hist').addEventListener('click', function(e){
    var t = e.target;
    if (t.dataset.load !== undefined){ fill(loadRecords()[parseInt(t.dataset.load, 10)]); }
    if (t.dataset.del !== undefined){
      var l = loadRecords(); l.splice(parseInt(t.dataset.del, 10), 1);
      storeRecords(l); renderHistory(); toast('削除しました');
    }
  });

  $('csv').addEventListener('click', function(){
    var list = loadRecords();
    if (!list.length) return;
    var rows = [['日付','景品名','取引先','日数','下限P','中央M','上限O','CR','発注個数','入数','単位数']];
    list.forEach(function(r){
      rows.push([r.date, r.name, r.vendor, r.days || '', r.p, r.m, r.o,
        (r.cr ? r.cr.toFixed(2) : '追加発注あり'), r.qty, r.unit || '', r.units || '']);
    });
    var csv = '﻿' + rows.map(function(row){
      return row.map(function(c){ return '"' + String(c === null || c === undefined ? '' : c).replace(/"/g,'""') + '"'; }).join(',');
    }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'hacchu-log.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('書き出しました');
  });

  Array.prototype.forEach.call(document.querySelectorAll('#crseg button'), function(btn){
    btn.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('#crseg button'), function(b){ b.setAttribute('aria-pressed','false'); });
      btn.setAttribute('aria-pressed','true');
      if (btn.dataset.cr === 'custom'){
        state.mode = 'custom';
        $('crcalc').open = true;
      } else {
        state.mode = 'preset';
        state.cr = parseFloat(btn.dataset.cr);
        $('crcalc').open = false;
        try { localStorage.setItem('orderqty-cr2', String(state.cr)); } catch(e) {}
      }
      calc();
    });
  });

  function setReorder(on){
    state.reorder = !!on;
    Array.prototype.forEach.call(document.querySelectorAll('#reorderseg button'), function(b){
      b.setAttribute('aria-pressed', (b.dataset.r === (on ? '1' : '0')) ? 'true' : 'false');
    });
    $('reorderout').innerHTML = on
      ? '<b>「できる」を選択中。</b>控えめな数を出します。売れ行きを見て追加してください。'
      : '<b>「できない」を選択中。</b>品切れに備えて、安全側に上乗せした数を出します。';
    $('crcard').style.opacity = on ? '0.45' : '1';
  }
  Array.prototype.forEach.call(document.querySelectorAll('#reorderseg button'), function(btn){
    btn.addEventListener('click', function(){ setReorder(btn.dataset.r === '1'); calc(); });
  });

  Array.prototype.forEach.call(document.querySelectorAll('#holseg button'), function(btn){
    btn.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('#holseg button'), function(b){
        b.setAttribute('aria-pressed','false');
      });
      btn.setAttribute('aria-pressed','true');
      $('holidays').value = btn.dataset.h;
      calc();
    });
  });

  $('holidays').addEventListener('input', function(){
    Array.prototype.forEach.call(document.querySelectorAll('#holseg button'), function(b){
      b.setAttribute('aria-pressed', b.dataset.h === $('holidays').value ? 'true' : 'false');
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('#dayseg button'), function(btn){
    btn.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('#dayseg button'), function(b){
        b.setAttribute('aria-pressed','false');
      });
      btn.setAttribute('aria-pressed','true');
      $('days').value = btn.dataset.days;
      calc();
    });
  });

  $('days').addEventListener('input', function(){
    Array.prototype.forEach.call(document.querySelectorAll('#dayseg button'), function(b){
      b.setAttribute('aria-pressed', b.dataset.days === $('days').value ? 'true' : 'false');
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('#modeseg button'), function(btn){
    btn.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('#modeseg button'), function(b){
        b.setAttribute('aria-pressed','false');
      });
      btn.setAttribute('aria-pressed','true');
      state.input = btn.dataset.mode;
      $('autobox').style.display = state.input === 'auto' ? 'block' : 'none';
      $('manualbox').style.display = state.input === 'auto' ? 'none' : 'block';
      calc();
    });
  });

  ['o','m','p','rev','cost','salv','unit','uname','name','vendor',
   'daily','days','pcost','rate','lowk','highk','start','kfri','ksat','ksun','movecost','holidays',
   'expiry','selldays','tripcost','tripqty','worktime','wage','disposal'].forEach(function(id){
    $(id).addEventListener('input', calc);
  });

  // 前回選んだ CR をボタンの表示にも反映する
  Array.prototype.forEach.call(document.querySelectorAll('#crseg button'), function(b){
    b.setAttribute('aria-pressed', parseFloat(b.dataset.cr) === state.cr ? 'true' : 'false');
  });

  renderHistory();
  calc();
})();
</script>
</template>

            <label for="hRate" style="text-align:center">眠るお金の率（年%）</label>
            <input type="text" id="hRate" inputmode="decimal" placeholder="3">
          </div>
          <div>
            <label for="hLoss" style="text-align:center">傷み・紛失（年%）</label>
            <input type="text" id="hLoss" inputmode="decimal" placeholder="2">
          </div>
        </div>
        <p class="hint">眠るお金の率は、在庫に使ったお金を他に回せない分の目安で、借入の金利などを入れます。傷み・紛失は、1年で仕入価格の何%ぶんが使えなくなるかです。</p>

        <p class="hint" id="hOut">1個あたり：–</p>
      </details>
      <div class="explain">
        <p><b>備品発注サポート</b>は、EOQ（経済的発注量）という考え方で、発注にかかる費用と保管にかかる費用の合計が一番小さくなる、1回あたりの発注量です。</p>
        <p>少しずつ何度も発注すると、発注のたびにかかる費用がかさみます。まとめて大量に発注すると、置いておく費用がかさみます。EOQ はその釣り合う点です。</p>
        <p><b>1回の発注コスト</b>：1回発注するたびにかかる費用。送料や、発注・検品の作業時間ぶんの人件費など。</p>
        <p><b>保管コスト</b>：1個を<span id="hPer">1年間</span>置いておくのにかかる費用。倉庫やバックヤードの場所代など。</p>
        <p>週間使用数は、選んだ期間の使用数に直して計算します（<span id="samePer">年間なら × 52週</span>）。保管コストは、その期間の金額で入れてください。</p>
      </div>
    </div>
  </div>

  <div class="card" id="demandCard">
    <label>需要 d と ばらつき σd の出し方</label>
    <div class="seg" id="dmode">
      <button type="button" data-v="data" aria-pressed="true">過去の販売数から</button>
      <button type="button" data-v="direct" aria-pressed="false">直接入れる</button>
    </div>

    <div id="dataBox" style="margin-top:12px">
      <label for="sales">1日ごとの販売数（過去8〜12日分）</label>
      <textarea id="sales" inputmode="numeric" placeholder="例）18 22 15 30 34 20 17 19 25 28"></textarea>
      <p class="hint">スペース・改行・カンマ区切りで貼り付けられます。</p>
      <p class="hint" id="dataOut">–</p>
    </div>

    <div id="directBox" style="margin-top:12px" hidden>
      <div class="row">
        <div>
          <label for="dIn" style="text-align:center">d 1日平均需要</label>
          <input type="text" id="dIn" inputmode="decimal" placeholder="22.8">
        </div>
        <div>
          <label for="sdIn" style="text-align:center">σd 1日の標準偏差</label>
          <input type="text" id="sdIn" inputmode="decimal" placeholder="6.2">
        </div>
      </div>
    </div>
  </div>

  <div class="card" id="ltCard">
    <div class="row">
      <div>
        <label for="lt" style="text-align:center">LT リードタイム（日）</label>
        <input type="number" id="lt" inputmode="numeric" placeholder="3">
      </div>
      <div>
        <label for="cs" style="text-align:center">CS 現在庫（個）</label>
        <input type="number" id="cs" inputmode="numeric" placeholder="80">
      </div>
    </div>
    <div class="explain">
      <p><b>リードタイム</b>は、発注してから商品が届くまでの日数です。入荷日 − 発注日 で数えます。</p>
      <p>例）月曜に発注して木曜に入荷するなら 3日。</p>
      <p>この間も景品は取られ続けるので、届くまでの分を在庫で持ちこたえる必要があります。リードタイムが長いほど発注点 R は高くなります。</p>
    </div>
  </div>

  <div class="card" id="crCard">
    <label>臨界比 CR</label>
    <p class="hint" style="margin-top:0">
      <b>仕入れすぎた損</b>と<b>品切れで取り逃がした損</b>を天秤にかけた数字です。
      数字が大きいほど「品切れの方が痛い」と考え、多めに発注します。
      品切れを避けたい景品は 0.70 以上にしてください。
    </p>
    <div class="seg" id="crseg">
      <button type="button" data-cr="0.65" aria-pressed="false">0.65</button>
      <button type="button" data-cr="0.70" aria-pressed="true">0.70</button>
      <button type="button" data-cr="0.75" aria-pressed="false">0.75</button>
      <button type="button" data-cr="0.80" aria-pressed="false">0.80</button>
      <button type="button" data-cr="custom" aria-pressed="false">金額から</button>
    </div>
    <p class="hint" id="zOut">z ＝ –</p>
    <details id="crcalc">
      <summary>金額から CR を出す</summary>
      <div class="row" style="margin-top:8px">
        <div>
          <label for="rev" style="text-align:center">想定売上／個</label>
          <input type="text" id="rev" inputmode="numeric" placeholder="400">
        </div>
        <div>
          <label for="cost" style="text-align:center">仕入価格／個</label>
          <input type="text" id="cost" inputmode="numeric" placeholder="120">
        </div>
        <div>
          <label for="salv" style="text-align:center">残存価値／個</label>
          <input type="text" id="salv" inputmode="numeric" placeholder="0">
        </div>
      </div>
      <p class="hint">CR ＝ Cu ÷（Cu ＋ Co）　Cu ＝ 売上 − 仕入　Co ＝ 仕入 − 残存価値</p>
      <p class="hint">
        <b>残存価値</b>は、余った景品が<b>まだ生む価値</b>のことです。他店舗へ移して使える分や、事故台などで回収できる額を指します。
        ここが大きいほど「余っても無駄にならない」ので、多めに発注してよいことになります。
        逆に賞味期限切れや旬を過ぎた景品はゼロに近づき、<b>廃棄にお金がかかる場合はマイナス</b>になります。
      </p>

      <details style="margin-top:16px; padding-top:14px; border-top:1px solid var(--line)">
        <summary>残存価値の見積もりサポート</summary>
        <p class="hint" style="margin-top:6px">選ぶと、上の残存価値に自動で入ります。</p>

        <p class="hint" style="margin-top:12px; color:var(--ink)">① 余った分を他店・他台で使い切れるか</p>
        <div class="seg" id="segUse">
          <button type="button" data-v="1" aria-pressed="false">ほぼ全部</button>
          <button type="button" data-v="0.8" aria-pressed="true">だいたい</button>
          <button type="button" data-v="0.5" aria-pressed="false">半分</button>
          <button type="button" data-v="0.15" aria-pressed="false">ほぼ無理</button>
        </div>

        <p class="hint" style="margin-top:12px; color:var(--ink)">② 旬の落ちやすさ</p>
        <div class="seg" id="segFresh">
          <button type="button" data-v="1" aria-pressed="false">定番（落ちない）</button>
          <button type="button" data-v="0.8" aria-pressed="true">ふつう</button>
          <button type="button" data-v="0.5" aria-pressed="false">話題次第</button>
        </div>

        <p class="hint" style="margin-top:12px; color:var(--ink)">③ 食品（賞味期限）</p>
        <div class="seg" id="segFood">
          <button type="button" data-v="0" aria-pressed="true">期限なし</button>
          <button type="button" data-v="1" aria-pressed="false">賞味期限あり</button>
        </div>
        <div id="foodbox" style="margin-top:10px" hidden>
          <div class="row">
            <div>
              <label for="expiry" style="text-align:center">賞味期限</label>
              <input type="date" id="expiry">
            </div>
          </div>
          <div style="margin-top:10px">
            <label for="selldays">他店で売り切るのに必要な日数</label>
            <input type="number" id="selldays" inputmode="numeric" placeholder="30" value="30">
          </div>
          <p class="hint" id="foodout">期限による目減り：–</p>
        </div>

        <div style="margin-top:12px">
          <label for="disposal">④ 廃棄にかかる費用（1個あたり・円）</label>
          <input type="text" id="disposal" inputmode="numeric" placeholder="0">
          <p class="hint">使い切れずに捨てる分の処分費。かからなければ空欄のままで構いません。</p>
        </div>

        <div style="margin-top:12px">
          <label for="movecost">⑤ 移送・保管の手間（1個あたり・円）</label>
          <input type="text" id="movecost" inputmode="numeric" placeholder="50">
          <details style="margin-top:6px">
            <summary>手間を計算する</summary>
            <div class="row" style="margin-top:8px">
              <div>
                <label for="tripcost" style="text-align:center">1便の運賃（円）</label>
                <input type="text" id="tripcost" inputmode="numeric" placeholder="3,000">
              </div>
              <div>
                <label for="tripqty" style="text-align:center">1便で運ぶ個数</label>
                <input type="number" id="tripqty" inputmode="numeric" placeholder="200">
              </div>
            </div>
            <div class="row" style="margin-top:10px">
              <div>
                <label for="worktime" style="text-align:center">積み下ろし（分）</label>
                <input type="number" id="worktime" inputmode="numeric" placeholder="30">
              </div>
              <div>
                <label for="wage" style="text-align:center">時給（円）</label>
                <input type="text" id="wage" inputmode="numeric" placeholder="1,200">
              </div>
            </div>
            <p class="hint" id="moveout">1個あたり：–</p>
          </details>
        </div>
        <p class="hint" id="salvout">残存価値：–</p>
      </details>

      <p class="hint" id="crOut">CR：–</p>
    </details>
  </div>

  <div class="card">
    <label>計算の中身</label>
    <div class="calc" id="calc"></div>
    <p class="hint" id="foot"></p>
  </div>

  <div class="card result" id="result">
    <span class="modetag" id="modeTag">発注点 R を計算中</span>
    <p class="qlabel" id="resLabel">発注点 R</p>
    <div><span class="qnum" id="resNum">–</span><span class="qunit">個</span></div>
    <p class="qsub" id="resSub">–</p>
    <span class="chip" id="chip" hidden></span>
  </div>

  <div class="card">
    <label for="memo">メモ</label>
    <textarea id="memo" class="memo" placeholder="例）土日に売れやすい。次回は取引先に納期を確認"></textarea>
    <p class="hint">保存・共有するときに一緒に残ります。</p>
    <div class="btnrow">
      <button type="button" class="btn" id="save">保存する</button>
      <button type="button" class="btn sub" id="share">共有する</button>
    </div>
    <textarea id="sharebox" class="sharebox" readonly hidden></textarea>
  </div>

  <div class="card" id="histcard" hidden>
    <label style="margin-bottom:10px">保存した計算</label>
    <div id="hist"></div>
    <div class="recbtns" style="margin-top:14px">
      <button type="button" id="csv">CSVで書き出す</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var last = null;
  var st = { tab:'R', dmode:'data', qmode:'periodic', cr:0.70, crmode:'preset', per:'year' };

  // 逆正規分布（Acklam の近似）
  function ppf(p){
    if (!(p > 0 && p < 1)) return NaN;
    var a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00],
        b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01],
        c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00],
        d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
    var pl=0.02425, q, r;
    if (p < pl){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
    if (p > 1-pl){ q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
    q=p-0.5; r=q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  }

  // 全角→半角、数字・小数点・マイナス以外を除いて数値に
  function toNum(str){
    var out=''; str=String(str);
    for (var i=0;i<str.length;i++){
      var c=str.charCodeAt(i);
      if (c>=0xFF10 && c<=0xFF19) out+=String.fromCharCode(c-0xFF10+48);
      else if ((c>=48&&c<=57)||str[i]==='.'||str[i]==='-') out+=str[i];
      else if (c===0xFF0E) out+='.';
    }
    var v=parseFloat(out); return isFinite(v)?v:null;
  }
  function num(id){ return toNum($(id).value); }
  function f1(n){ return (Math.round(n*10)/10).toLocaleString('ja-JP'); }
  function f2(n){ return n.toFixed(2); }
  function intc(n){ return Math.round(n).toLocaleString('ja-JP'); }

  // 貼り付けた販売数から平均と標本標準偏差（n−1）
  function fromData(){
    var parts = $('sales').value.split(/[\s,、，;]+/).filter(function(s){ return s !== ''; });
    var xs = [];
    parts.forEach(function(p){ var v=toNum(p); if (v!==null) xs.push(v); });
    if (xs.length < 2){ $('dataOut').textContent = xs.length ? '2日分以上入れてください' : '–'; return null; }
    var sum=0; xs.forEach(function(x){ sum+=x; });
    var mean=sum/xs.length, ss=0;
    xs.forEach(function(x){ ss+=(x-mean)*(x-mean); });
    var sd=Math.sqrt(ss/(xs.length-1));
    var msg = xs.length + '日分　d ＝ ' + f1(mean) + '個 ／ σd ＝ ' + f1(sd) + '個';
    if (xs.length < 8 || xs.length > 12) msg += '　（目安の8〜12日分から外れています）';
    $('dataOut').textContent = msg;
    return { d:mean, sd:sd };
  }
  function getDemand(){
    if (st.dmode==='data') return fromData();
    var d=num('dIn'), s=num('sdIn');
    return (d===null||s===null) ? null : { d:d, sd:s };
  }

  function getZ(){
    if (st.crmode === 'preset') return ppf(st.cr);
    var rev=num('rev'), cost=num('cost'), salv=num('salv')||0;
    if (rev===null || cost===null){ $('crOut').textContent='CR：–'; return null; }
    var cu=rev-cost, co=cost-salv;
    if (!(cu>0 && co>0)){ $('crOut').textContent='CR：–（売上が仕入より高く、残存価値が仕入より低い必要があります）'; return null; }
    var raw=cu/(cu+co);
    st.cr=Math.min(raw,0.99);
    $('crOut').textContent='CR：'+f2(st.cr)+'（Cu '+intc(cu)+'円 ／ Co '+intc(co)+'円）'+(raw>0.99?'　※ 0.99 で頭打ち':'');
    return ppf(st.cr);
  }

  function show(label, val, sub){
    $('resLabel').textContent=label; $('resNum').textContent=val; $('resSub').textContent=sub;
  }

  function layout(){
    var isQ = st.tab==='Q', eoq = isQ && st.qmode==='eoq';
    $('tabR').setAttribute('aria-selected', isQ ? 'false' : 'true');
    $('tabQ').setAttribute('aria-selected', isQ ? 'true' : 'false');
    document.body.classList.toggle('mR', !isQ);
    document.body.classList.toggle('mQ', isQ);
    $('modeTag').textContent = isQ ? '発注量 Q を計算中' : '発注点 R を計算中';
    $('qCard').hidden = !isQ;
    $('ltCard').hidden = eoq;
    $('crCard').hidden = eoq;
    $('periodicBox').hidden = st.qmode!=='periodic';
    $('eoqBox').hidden = st.qmode!=='eoq';
    var y = st.per==='year';
    $('demandCard').hidden = eoq;
    $('hLabel').textContent = y ? '年間保管コスト／個（円）' : '月間保管コスト／個（円）';
    $('hPer').textContent = y ? '1年間' : '1か月間';
    $('samePer').textContent = y ? '年間なら × 52週' : '月間なら × 52 ÷ 12 週';
    $('foot').innerHTML = !isQ ? 'R ＝ d × LT ＋ z × σd × √LT'
      : st.qmode==='periodic' ? 'Q ＝ d ×（i ＋ LT）＋ z × σd × √(i ＋ LT) − CS'
      : 'EOQ ＝ √(2 × 期間の使用数 × 発注コスト ÷ 保管コスト)';
  }

  function calc(){
    layout();
    var dd=getDemand(), lt=num('lt'), csIn=num('cs'), z=getZ();
    var cs = csIn===null ? 0 : csIn, csNote = csIn===null ? '（未記入のため0個）' : '';
    $('zOut').textContent = 'z ＝ ' + (z===null||isNaN(z) ? '–' : f2(z));
    var chip=$('chip'); chip.hidden=true;
    $('result').className='card result';
    var lines=[];
    last=null;

    if (st.tab==='R'){
      if (!dd || lt===null || lt<0 || z===null || isNaN(z)){
        show('発注点 R','–','d・σd・LT・CR を入れてください');
        $('calc').innerHTML='<div class="k">入力がそろうと表示します</div>'; return;
      }
      var rBase=dd.d*lt, rSafe=z*dd.sd*Math.sqrt(lt), R=rBase+rSafe, Rr=Math.ceil(R);
      show('発注点 R', intc(Rr), '在庫がこの数以下になったら発注');
      lines.push('<div>R ＝ d × LT ＋ z × σd × √LT</div>');
      lines.push('<div class="k">＝ '+f1(dd.d)+' × '+lt+' ＋ '+f2(z)+' × '+f1(dd.sd)+' × √'+lt+'</div>');
      lines.push('<div class="k">＝ '+f1(rBase)+' ＋ '+f1(rSafe)+'（安全在庫） ＝ '+f1(R)+' → <b>'+Rr+'個</b></div>');
      var judge;
      chip.hidden=false;
      if (cs<=Rr){
        $('result').className='card result ng';
        chip.innerHTML='<span class="big">⚠ 発注してください</span>現在庫 '+cs+'個'+csNote+' ≦ 発注点 '+Rr+'個';
        judge='発注が必要';
      } else {
        $('result').className='card result ok';
        chip.innerHTML='<span class="big">まだ発注しません</span>現在庫 '+cs+'個 ＞ 発注点 '+Rr+'個';
        judge='まだ発注しない';
      }
      last={ kind:'R', label:'発注点 R', qty:Rr, judge:judge, d:dd.d, sd:dd.sd, lt:lt, cs:cs, z:z,
        lines:['発注点 R：'+Rr+'個', judge+'（現在庫 '+cs+'個'+csNote+'）', 'd '+f1(dd.d)+' ／ σd '+f1(dd.sd)+' ／ LT '+lt+'日 ／ CR '+f2(st.cr)+' ／ z '+f2(z)] };
    } else if (st.qmode==='periodic'){
      var iv=num('iv');
      if (!dd || lt===null || lt<0 || z===null || isNaN(z) || iv===null || iv<=0){
        show('発注量 Q（定期発注）','–','d・σd・LT・CR・発注間隔を入れてください');
        $('calc').innerHTML='<div class="k">入力がそろうと表示します</div>'; return;
      }
      var T=iv+lt, qBase=dd.d*T, qSafe=z*dd.sd*Math.sqrt(T), Q=qBase+qSafe-cs, Qr=Math.max(0,Math.ceil(Q));
      show('発注量 Q（定期発注）', intc(Qr), (Q<=0 ? '今の在庫で次回の発注まで足ります' : iv+'日ごとの発注で、今回この数')+(csNote?'　現在庫は未記入のため0個で計算':''));
      last={ kind:'P', label:'発注量 Q（定期発注）', qty:Qr, d:dd.d, sd:dd.sd, lt:lt, cs:cs, z:z, iv:iv,
        lines:['発注量 Q（定期発注）：'+Qr+'個', '発注間隔 '+iv+'日 ／ LT '+lt+'日 ／ 現在庫 '+cs+'個'+csNote, 'd '+f1(dd.d)+' ／ σd '+f1(dd.sd)+' ／ CR '+f2(st.cr)+' ／ z '+f2(z)] };
      lines.push('<div>Q ＝ d ×（i ＋ LT）＋ z × σd × √(i ＋ LT) − CS</div>');
      lines.push('<div class="k">＝ '+f1(dd.d)+' × '+T+' ＋ '+f2(z)+' × '+f1(dd.sd)+' × √'+T+' − '+cs+'</div>');
      lines.push('<div class="k">＝ '+f1(qBase)+' ＋ '+f1(qSafe)+'（安全在庫） − '+cs+' ＝ '+f1(Q)+' → <b>'+Qr+'個</b></div>');
    } else {
      var y=st.per==='year';
      var wk=num('annual');
      var S=num('ocost'), H=num('hcost');
      if (wk===null || wk<=0 || S===null || H===null || S<=0 || H<=0){
        show('備品発注サポート（倉庫向け）','–','週間使用数・発注コスト・保管コストを入れてください');
        $('calc').innerHTML='<div class="k">入力がそろうと表示します</div>'; return;
      }
      // 週間使用数を、保管コストと同じ期間（年間は52週、月間は52÷12週）にそろえる
      var weeks = y ? 52 : 52/12, dem = wk*weeks;
      var E=Math.sqrt(2*dem*S/H), Er=Math.ceil(E);
      show('備品発注サポート（倉庫向け）', intc(Er), '在庫が R 以下になったら、毎回この数を発注');
      last={ kind:'E', label:'備品発注サポート（倉庫向け）', qty:Er, per:(y?'年間':'月間'), wk:wk, dem:dem, S:S, H:H,
        lines:['備品発注サポート（倉庫向け）：'+Er+'個', '週間使用数 '+f1(wk)+'個（'+(y?'年間':'月間')+' '+f1(dem)+'個） ／ 発注コスト '+intc(S)+'円 ／ 保管コスト '+f1(H)+'円'] };
      lines.push('<div>'+(y?'年間':'月間')+'の使用数 ＝ 週間使用数 × '+(y?'52週':'52 ÷ 12 週')+'</div>');
      lines.push('<div class="k">＝ '+f1(wk)+' × '+(y?'52':f2(weeks))+' ＝ '+f1(dem)+'個</div>');
      lines.push('<div style="margin-top:10px">EOQ ＝ √(2 × '+(y?'年間':'月間')+'の使用数 × 発注コスト ÷ '+(y?'年間':'月間')+'保管コスト)</div>');
      lines.push('<div class="k">＝ √(2 × '+f1(dem)+' × '+intc(S)+' ÷ '+f1(H)+') ＝ '+f1(E)+' → <b>'+Er+'個</b></div>');
    }
    $('calc').innerHTML=lines.join('');
  }

  function seg(id, fn){
    var btns=document.querySelectorAll('#'+id+' button');
    Array.prototype.forEach.call(btns, function(btn){
      btn.addEventListener('click', function(){
        Array.prototype.forEach.call(btns, function(b){ b.setAttribute('aria-pressed','false'); });
        btn.setAttribute('aria-pressed','true');
        fn(btn); calc();
      });
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(btn){
    btn.addEventListener('click', function(){ st.tab=btn.dataset.t; calc(); });
  });
  seg('dmode', function(b){ st.dmode=b.dataset.v; $('dataBox').hidden=st.dmode!=='data'; $('directBox').hidden=st.dmode!=='direct'; });
  seg('qmode', function(b){ st.qmode=b.dataset.v; });
  // 保管コストが基本値のままなら、期間に合わせて入れ替える（年間50円／月間 50÷12円）
  var H_BASE_Y='50', H_BASE_M=String(Math.round(50/12*10)/10);
  seg('pseg', function(b){
    st.per=b.dataset.p;
    var hv=$('hcost').value.trim();
    if (st.per==='month' && hv===H_BASE_Y) $('hcost').value=H_BASE_M;
    if (st.per==='year' && hv===H_BASE_M) $('hcost').value=H_BASE_Y;
  });
  seg('crseg', function(b){
    if (b.dataset.cr==='custom'){ st.crmode='custom'; $('crcalc').open=true; }
    else { st.crmode='preset'; st.cr=parseFloat(b.dataset.cr); $('crcalc').open=false; }
  });
  seg('iseg', function(b){
    if (b.dataset.i==='custom'){ $('ivRow').hidden=false; $('iv').focus(); }
    else { $('ivRow').hidden=true; $('iv').value=b.dataset.i; }
  });

  // ---- 残存価値の見積もりサポート ----
  var salvSel = { use:0.8, fresh:0.8, food:0 };
  var salvUsed = false;   // サポートを触るまでは、手入力の残存価値を上書きしない

  function moveCost(){
    var trip=num('tripcost'), qty=num('tripqty'), mins=num('worktime'), wage=num('wage');
    if (trip===null || qty===null || qty<=0){
      $('moveout').textContent='1個あたり：–　（運賃と個数を入れてください）'; return;
    }
    if (mins===null) mins=0;
    if (wage===null) wage=0;
    var labor=mins/60*wage, per=Math.round((trip+labor)/qty);
    $('moveout').textContent='1個あたり：'+per+'円　（運賃 '+intc(trip)+' ＋ 人件費 '+intc(labor)+' ÷ '+qty+'個）';
    $('movecost').value=String(per);
  }

  // 賞味期限：今日から数えて、残り日数が売り切りに必要な日数に届くか
  function foodFactor(){
    if (!salvSel.food) return 1;
    var exp=$('expiry').value, need=num('selldays');
    if (need===null || need<=0) need=30;
    if (!exp){ $('foodout').textContent='期限による目減り：–　（賞味期限を入れてください）'; return 1; }
    var today=new Date(); today.setHours(0,0,0,0);
    var left=Math.floor((new Date(exp+'T00:00:00')-today)/86400000);
    var f = left<=0 ? 0 : (left>=need ? 1 : left/need);
    $('foodout').textContent='期限による目減り：'+f2(f)+'倍　（今日から残り '+left+'日 ／ 必要 '+need+'日）'
      +(f===0?'　期限切れのため残存価値ゼロ':'');
    return f;
  }

  function salvage(){
    if (!salvUsed) return;
    var cost=num('cost');
    if (cost===null || cost<=0){ $('salvout').textContent='残存価値：–　（仕入価格を入れてください）'; return; }
    var move=num('movecost'); if (move===null) move=50;
    var disp=num('disposal')||0;
    var keep=salvSel.use*foodFactor();
    var v=Math.round(cost*keep*salvSel.fresh - move*keep - disp*(1-keep));
    $('salv').value=String(v);
    $('salvout').textContent='残存価値：'+(v<0?'−':'')+intc(Math.abs(v))+'円'
      +(v<0?'（廃棄費用が上回るためマイナス）':'')
      +'　（使える割合 '+Math.round(keep*100)+'%）';
  }

  function segPick(boxId, key){
    var btns=document.querySelectorAll('#'+boxId+' button');
    Array.prototype.forEach.call(btns, function(btn){
      btn.addEventListener('click', function(){
        Array.prototype.forEach.call(btns, function(b){ b.setAttribute('aria-pressed','false'); });
        btn.setAttribute('aria-pressed','true');
        salvSel[key]=parseFloat(btn.dataset.v);
        salvUsed=true;
        if (key==='food') $('foodbox').hidden = btn.dataset.v!=='1';
        salvage(); calc();
      });
    });
  }
  segPick('segUse','use');
  segPick('segFresh','fresh');
  segPick('segFood','food');
  ['expiry','selldays','disposal','movecost'].forEach(function(id){
    $(id).addEventListener('input', function(){ salvUsed=true; salvage(); calc(); });
  });
  $('cost').addEventListener('input', function(){ salvage(); calc(); });
  ['tripcost','tripqty','worktime','wage'].forEach(function(id){
    $(id).addEventListener('input', function(){ salvUsed=true; moveCost(); salvage(); calc(); });
  });

  // ---- 保存・共有 ----
  function toast(msg){
    var t=$('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  function shareText(){
    var name=$('name').value.trim(), vendor=$('vendor').value.trim(), memo=$('memo').value.trim();
    var out=[(name||'(名称なし)')+(vendor?'／'+vendor:'')];
    last.lines.forEach(function(l){ out.push(l); });
    if (memo) out.push('メモ：'+memo);
    return out.join('\n');
  }
  function fallback(text){
    var box=$('sharebox'); box.value=text; box.hidden=false;
    box.focus(); box.select();
    toast('文字を選択しました。コピーして送ってください');
  }
  $('share').addEventListener('click', function(){
    if (!last){ toast('先に数字を入れてください'); return; }
    var text=shareText();
    $('sharebox').hidden=true;
    function copy(){
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ toast('コピーしました'); }, function(){ fallback(text); });
      } else fallback(text);
    }
    if (navigator.share){
      navigator.share({ text:text }).catch(function(err){ if (!err || err.name!=='AbortError') copy(); });
    } else copy();
  });

  var KEY='keizoku-records';
  var FIELDS=['name','vendor','memo','sales','dIn','sdIn','lt','cs','rev','cost','salv','iv','annual','ocost','hcost'];

  function loadRecords(){
    try { var raw=localStorage.getItem(KEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function storeRecords(list){
    try { localStorage.setItem(KEY, JSON.stringify(list)); return true; }
    catch(e){ return false; }
  }
  function setSeg(id, attr, val){
    Array.prototype.forEach.call(document.querySelectorAll('#'+id+' button'), function(b){
      b.setAttribute('aria-pressed', b.getAttribute(attr)===val ? 'true' : 'false');
    });
  }

  function renderHistory(){
    var list=loadRecords(), box=$('hist'), names={};
    box.innerHTML='';
    $('histcard').hidden = !list.length;
    list.forEach(function(r, i){
      if (r.f && r.f.vendor) names[r.f.vendor]=1;
      var d=document.createElement('div');
      d.className='rec';
      d.innerHTML='<h3></h3><p></p><div class="recbtns">'
        +'<button type="button" data-load="'+i+'">呼び出す</button>'
        +'<button type="button" class="del" data-del="'+i+'">削除</button></div>';
      d.querySelector('h3').textContent=(r.f.name||'(名称なし)')+'　'+r.res.label+' '+r.res.qty+'個';
      d.querySelector('p').textContent=(r.f.vendor ? r.f.vendor+'／' : '')+r.date
        +(r.res.judge ? '　'+r.res.judge : '')+(r.f.memo ? '　メモ：'+r.f.memo : '');
      box.appendChild(d);
    });
    var dl=$('vendors'); dl.innerHTML='';
    Object.keys(names).forEach(function(n){ var o=document.createElement('option'); o.value=n; dl.appendChild(o); });
  }

  function fill(r){
    FIELDS.forEach(function(id){ $(id).value = r.f[id]!==undefined ? r.f[id] : ''; });
    st.tab=r.st.tab; st.dmode=r.st.dmode; st.qmode=r.st.qmode; st.per=r.st.per;
    st.crmode=r.st.crmode; st.cr=r.st.cr;
    setSeg('dmode','data-v',st.dmode);
    $('dataBox').hidden=st.dmode!=='data'; $('directBox').hidden=st.dmode!=='direct';
    setSeg('qmode','data-v',st.qmode);
    setSeg('pseg','data-p',st.per);
    setSeg('crseg','data-cr', st.crmode==='custom' ? 'custom' : st.cr.toFixed(2));
    $('crcalc').open = st.crmode==='custom';
    var ivv=$('iv').value, preset=(ivv==='3'||ivv==='4'||ivv==='7');
    setSeg('iseg','data-i', preset ? ivv : 'custom');
    $('ivRow').hidden = preset;
    calc();
    window.scrollTo({ top:0, behavior:'smooth' });
    toast('呼び出しました');
  }

  $('save').addEventListener('click', function(){
    if (!last){ toast('先に数字を入れてください'); return; }
    var f={};
    FIELDS.forEach(function(id){ f[id]=$(id).value; });
    var d=new Date();
    var rec={
      date: d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(),
      f: f,
      st: { tab:st.tab, dmode:st.dmode, qmode:st.qmode, per:st.per, crmode:st.crmode, cr:st.cr },
      res: JSON.parse(JSON.stringify(last))
    };
    var list=loadRecords();
    list.unshift(rec);
    if (list.length>50) list=list.slice(0,50);
    if (storeRecords(list)){ renderHistory(); toast('保存しました'); }
    else toast('保存できませんでした');
  });

  $('hist').addEventListener('click', function(e){
    var t=e.target;
    if (t.dataset.load!==undefined){ fill(loadRecords()[parseInt(t.dataset.load,10)]); }
    if (t.dataset.del!==undefined){
      var l=loadRecords(); l.splice(parseInt(t.dataset.del,10),1);
      storeRecords(l); renderHistory(); toast('削除しました');
    }
  });

  $('csv').addEventListener('click', function(){
    var list=loadRecords();
    if (!list.length) return;
    function v(n, fn){ return (n===undefined||n===null) ? '' : (fn ? fn(n) : n); }
    var rows=[['日付','景品名','取引先','種類','結果（個）','判定','d','σd','LT','CR','z','発注間隔','現在庫','週間使用数','期間','期間の使用数','発注コスト','保管コスト','メモ']];
    list.forEach(function(r){
      var x=r.res, eoq=x.kind==='E';
      rows.push([r.date, r.f.name, r.f.vendor, x.label, x.qty, v(x.judge),
        v(x.d, function(n){ return n.toFixed(1); }), v(x.sd, function(n){ return n.toFixed(1); }), v(x.lt),
        eoq ? '' : r.st.cr.toFixed(2), v(x.z, function(n){ return n.toFixed(2); }),
        v(x.iv), v(x.cs), v(x.wk), v(x.per), v(x.dem, function(n){ return n.toFixed(1); }), v(x.S), v(x.H), r.f.memo]);
    });
    var csv='\ufeff'+rows.map(function(row){
      return row.map(function(c){ return '"'+String(c===null||c===undefined?'':c).replace(/"/g,'""')+'"'; }).join(',');
    }).join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
    a.download='keizoku-hacchu-log.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('書き出しました');
  });

  // ---- 保管コストの計算サポート ----
  function holdCost(){
    var parts=[], month=0;
    var rent=num('hRent'), area=num('hArea'), per=num('hPerTsubo');
    if (rent!==null && area>0 && per>0){
      var sp=rent/area/per; month+=sp; parts.push('場所代 '+f1(sp)+'円');
    }
    var mins=num('hMin'), wage=num('hWage'), qty=num('hQty');
    if (mins!==null && wage!==null && qty>0){
      var lb=mins/60*wage/qty; month+=lb; parts.push('管理 '+f1(lb)+'円');
    }
    var price=num('hPrice');
    if (price!==null){
      var rate=num('hRate')||0, loss=num('hLoss')||0;
      var fin=price*rate/100/12, ls=price*loss/100/12;
      if (rate){ month+=fin; parts.push('眠るお金 '+f1(fin)+'円'); }
      if (loss){ month+=ls; parts.push('傷み・紛失 '+f1(ls)+'円'); }
    }
    if (!parts.length){ $('hOut').textContent='1個あたり：–　（使う項目を入れてください）'; return; }
    var y=st.per==='year', v=y?month*12:month;
    $('hcost').value=String(Math.round(v*10)/10);
    $('hOut').textContent='1個あたり '+(y?'年間 ':'月間 ')+f1(v)+'円　（月あたり内訳：'+parts.join(' ＋ ')+'）';
  }
  var H_IDS=['hRent','hArea','hPerTsubo','hMin','hWage','hQty','hPrice','hRate','hLoss'];
  H_IDS.forEach(function(id){
    $(id).addEventListener('input', function(){ holdCost(); calc(); });
  });
  // 年間／月間を切り替えたら、サポートを使っているときだけ入れ直す
  Array.prototype.forEach.call(document.querySelectorAll('#pseg button'), function(b){
    b.addEventListener('click', function(){
      var used=H_IDS.some(function(id){ return $(id).value.trim()!==''; });
      if (used){ holdCost(); calc(); }
    });
  });

  ['sales','dIn','sdIn','lt','cs','rev','salv','iv','annual','ocost','hcost'].forEach(function(id){
    $(id).addEventListener('input', calc);
  });
  renderHistory();
  calc();
})();
</script>
</template>

<script>
(function(){
  var METHOD = {
    limited: '三点見積もり法<small>限定発注 ／ 初めて仕入れる景品</small>',
    cont:    '発注点方式（Q,R方式）<small>継続発注 ／ 定番景品・備品</small>'
  };
  var loaded = {};
  function load(k){
    if (loaded[k]) return;
    loaded[k] = true;
    document.getElementById('f-' + k).srcdoc = '<!DOCTYPE html>\n' + document.getElementById('src-' + k).innerHTML;
  }
  function show(k){
    ['limited','cont'].forEach(function(x){
      document.getElementById('tab-' + x).setAttribute('aria-selected', x === k ? 'true' : 'false');
      document.getElementById('f-' + x).hidden = x !== k;
    });
    document.getElementById('method').innerHTML = METHOD[k];
    load(k);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){
    b.addEventListener('click', function(){ show(b.dataset.k); });
  });
  show('limited');
  load('cont');
})();
</script>
</body>
</html>
