<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>発注量クイック計算</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#f6f4ef; --card:#ffffff; --ink:#1e2833; --sub:#5b6570;
    --line:#dcd8cf; --accent:#c1553a; --teal:#2f6f6b; --soft:#ecebe4;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181c21; --card:#222830; --ink:#f0eee8; --sub:#a3abb4;
      --line:#39414b; --accent:#e08468; --teal:#7fbdb6; --soft:#2a313a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#181c21; --card:#222830; --ink:#f0eee8; --sub:#a3abb4;
    --line:#39414b; --accent:#e08468; --teal:#7fbdb6; --soft:#2a313a;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Atkinson Hyperlegible','BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,system-ui,sans-serif;
    font-size:18px; line-height:1.8; letter-spacing:0.04em; word-spacing:0.08em;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:520px; margin:0 auto; padding:16px 16px 48px}
  h1{font-size:19px; margin:4px 0 14px; font-weight:700}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px}
  .result{background:#1e2833; color:#f6f4ef; border:none; text-align:center; padding:28px 18px}
  .qnum{font-size:76px; font-weight:700; line-height:1.05; letter-spacing:-1px}
  .qunit{font-size:26px; font-weight:700; margin-left:6px}
  .qlabel{font-size:16px; opacity:.85; margin:0 0 6px; letter-spacing:.5px}
  .qsub{font-size:16px; opacity:.9; margin:14px 0 0; line-height:1.8}
  label{display:block; font-size:16px; color:var(--sub); margin-bottom:6px; font-weight:600}
  .row{display:flex; gap:10px}
  .row>div{flex:1}
  input[type=number],input[type=text]{
    width:100%; font-size:24px; font-weight:600; padding:12px 10px; text-align:center;
    border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink);
    font-family:inherit; -moz-appearance:textfield;
  }
  input[type=text]{font-size:17px; font-weight:400; text-align:left}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  input:focus{outline:2px solid var(--teal); outline-offset:1px}
  .hint{font-size:16px; color:var(--sub); margin:8px 0 0; line-height:1.8}
  .seg{display:flex; gap:8px; margin-top:4px}
  .seg button{
    flex:1; padding:12px 4px; font-size:16px; font-weight:600; font-family:inherit;
    border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); cursor:pointer;
  }
  .seg button[aria-pressed="true"]{background:var(--teal); border-color:var(--teal); color:#fff}
  .toggle{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .switch{
    flex:0 0 auto; width:60px; height:34px; border-radius:17px; border:1px solid var(--line);
    background:var(--soft); position:relative; cursor:pointer; padding:0;
  }
  .switch[aria-pressed="true"]{background:var(--accent); border-color:var(--accent)}
  .knob{position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:left .15s}
  .switch[aria-pressed="true"] .knob{left:29px}
  .breakdown{display:flex; gap:8px; margin-top:12px}
  .breakdown div{flex:1; background:var(--soft); border-radius:10px; padding:8px 4px; text-align:center}
  .bk{font-size:12px; color:var(--sub)}
  .bv{font-size:20px; font-weight:700}
  details{margin-top:4px}
  summary{font-size:17px; color:var(--teal); font-weight:600; cursor:pointer; padding:6px 0}
  .warn{color:var(--accent); font-size:16px; margin:10px 0 0}
  .foot{font-size:15px; color:var(--sub); text-align:center; margin-top:18px; line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <h1>発注量クイック計算<span style="font-weight:400;color:var(--sub);font-size:16px"> ／ 初めて仕入れる景品</span></h1>

  <div class="card result">
    <p class="qlabel" id="qlabel">発注量</p>
    <div><span class="qnum" id="q">–</span><span class="qunit" id="qunit">個</span></div>
    <p class="qsub" id="qsub">O・M・P を入れてください</p>
  </div>

  <div class="card">
    <label>見立て（この投入期間に何個取られるか）</label>
    <div class="row">
      <div>
        <label style="text-align:center">P 悲観</label>
        <input type="number" id="p" inputmode="numeric" placeholder="12">
      </div>
      <div>
        <label style="text-align:center">M 最頻</label>
        <input type="number" id="m" inputmode="numeric" placeholder="30">
      </div>
      <div>
        <label style="text-align:center">O 楽観</label>
        <input type="number" id="o" inputmode="numeric" placeholder="60">
      </div>
    </div>
    <p class="hint"><b>O と P は「あり得る範囲の端」</b>で、絶対にあり得ない極端な数字ではありません。目安は<b>10回に1回くらい起きる水準</b>。「最高に当たったら」「全然ダメだったら」と両端から聞くと出しやすくなります。</p>
    <p class="warn" id="warn" style="display:none"></p>
  </div>

  <div class="card">
    <label>仕入れ単位</label>
    <div class="row">
      <div>
        <label style="text-align:center">1単位の入数（個）</label>
        <input type="number" id="unit" inputmode="numeric" placeholder="12">
      </div>
      <div>
        <label style="text-align:center">単位の呼び方</label>
        <input type="text" id="uname" placeholder="箱" style="text-align:center; font-size:22px; font-weight:600">
      </div>
    </div>
    <p class="hint">入れると、発注量を単位に丸めて「何単位発注するか」を出します。</p>
  </div>

  <div class="card">
    <div class="toggle">
      <div>
        <label style="margin:0">追加発注できる</label>
        <p class="hint" style="margin-top:2px">オンなら μ だけで控えめに発注</p>
      </div>
      <button class="switch" id="reorder" aria-pressed="false" aria-label="追加発注できる"><span class="knob"></span></button>
    </div>
  </div>

  <div class="card" id="crcard">
    <label>臨界比 CR</label>
    <div class="seg">
      <button data-cr="0.6" aria-pressed="false">0.60</button>
      <button data-cr="0.65" aria-pressed="true">0.65</button>
      <button data-cr="0.7" aria-pressed="false">0.70</button>
      <button data-cr="custom" aria-pressed="false">金額から</button>
    </div>
    <details id="crcalc">
      <summary>金額から CR を出す</summary>
      <div class="row" style="margin-top:8px">
        <div>
          <label style="text-align:center">想定売上／個</label>
          <input type="number" id="rev" inputmode="numeric" placeholder="4000">
        </div>
        <div>
          <label style="text-align:center">仕入価格／個</label>
          <input type="number" id="cost" inputmode="numeric" placeholder="800">
        </div>
      </div>
      <div style="margin-top:10px">
        <label>残存価値／個（他店舗へ移して使える分＋回収額）</label>
        <input type="number" id="salv" inputmode="numeric" placeholder="0">
      </div>
      <p class="hint" id="crout">CR：–</p>
    </details>
  </div>

  <p class="foot">Q =（O + 4M + P）÷ 6 ＋ z ×（O − P）÷ 6</p>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var state = { cr: 0.65, mode: 'preset', reorder: false };

  try {
    var saved = localStorage.getItem('orderqty-cr');
    if (saved) { var v = parseFloat(saved); if (v > 0 && v < 1) state.cr = v; }
  } catch(e) {}

  // 逆正規分布（Acklam の近似）
  function ppf(p){
    if (!(p > 0 && p < 1)) return NaN;
    var a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00],
        b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01],
        c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00],
        d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
    var pl=0.02425, q, r;
    if (p < pl){
      q = Math.sqrt(-2*Math.log(p));
      return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    }
    if (p > 1-pl){
      q = Math.sqrt(-2*Math.log(1-p));
      return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    }
    q = p-0.5; r = q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  }

  function num(id){ var v = parseFloat($(id).value); return isFinite(v) ? v : null; }

  function calc(){
    var o = num('o'), m = num('m'), p = num('p');
    var warn = $('warn');
    warn.style.display = 'none';

    if (state.mode === 'custom'){
      var rev = num('rev'), cost = num('cost'), salv = num('salv') || 0;
      if (rev !== null && cost !== null){
        var cu = rev - cost, co = cost - salv;
        if (cu > 0 && co > 0){
          state.cr = cu / (cu + co);
          $('crout').textContent = 'CR：' + state.cr.toFixed(2) + '（Cu ' + Math.round(cu) + '円 ／ Co ' + Math.round(co) + '円）';
        } else {
          $('crout').textContent = 'CR：– （売上が仕入より高く、残存価値が仕入より低い必要があります）';
        }
      } else {
        $('crout').textContent = 'CR：–';
      }
    }

    var z = ppf(state.cr);

    if (o === null || m === null || p === null){
      $('q').textContent = '–';
      $('qunit').textContent = '個';
      $('qlabel').textContent = '発注量';
      $('qsub').textContent = 'O・M・P を入れてください';
      return;
    }
    if (!(o >= m && m >= p)){
      warn.textContent = '数値の大小が合いません（O ≧ M ≧ P）。';
      warn.style.display = 'block';
    }

    var mu = (o + 4*m + p) / 6;
    var sd = (o - p) / 6;
    var q = state.reorder ? mu : mu + z * sd;
    if (q < 0) q = 0;
    var qr = Math.ceil(q);
    var crnote = state.reorder ? '追加発注で調整する前提' : 'CR ' + state.cr.toFixed(2);

    var unit = num('unit');
    var uname = ($('uname').value || '').trim() || '箱';
    if (unit !== null && unit > 0){
      var units = Math.ceil(qr / unit);
      if (units < 1) units = 1;
      $('qlabel').textContent = '発注する単位数';
      $('q').textContent = units;
      $('qunit').textContent = uname;
      $('qsub').textContent = '必要 ' + qr + '個 → ' + unit + '個入り × ' + units + uname + ' ＝ ' + (units * unit) + '個　／　' + crnote;
    } else {
      $('qlabel').textContent = '発注量';
      $('q').textContent = qr;
      $('qunit').textContent = '個';
      $('qsub').textContent = crnote + ' ／ 仕入れ単位を入れると単位数で表示';
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function(btn){
    btn.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function(b){ b.setAttribute('aria-pressed','false'); });
      btn.setAttribute('aria-pressed','true');
      if (btn.dataset.cr === 'custom'){
        state.mode = 'custom';
        $('crcalc').open = true;
      } else {
        state.mode = 'preset';
        state.cr = parseFloat(btn.dataset.cr);
        $('crcalc').open = false;
        try { localStorage.setItem('orderqty-cr', String(state.cr)); } catch(e) {}
      }
      calc();
    });
  });

  $('reorder').addEventListener('click', function(){
    state.reorder = $('reorder').getAttribute('aria-pressed') !== 'true';
    $('reorder').setAttribute('aria-pressed', state.reorder ? 'true' : 'false');
    $('crcard').style.opacity = state.reorder ? '0.45' : '1';
    calc();
  });

  ['o','m','p','rev','cost','salv','unit','uname'].forEach(function(id){
    $(id).addEventListener('input', calc);
  });

  calc();
})();
</script>
</body>
</html>
